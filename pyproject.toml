[project]
name = "px-eval"
version = "0.1.0"
description = "Minimal Harbor rollout runner."
requires-python = ">=3.12"
dependencies = [
    "harbor[modal]==0.23.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/px_eval"]

[tool.pyright]
venv = ".venv"
venvPath = "."
